[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carculator_utils"
dynamic = ["version"]
description = "Shared vehicle life cycle assessment calculations and inventories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Romain Sacchi", email = "romain.sacchi@psi.ch"}]
dependencies = ["numpy>=1.26.4,<2", "pandas>=2.2.3", "scipy>=1.11", "xarray>=2024.1.0", "numexpr", "klausen", "stats_arrays>=0.6", "PyYAML", "pyprind", "pycountry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator_utils"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "hypothesis>=6", "openpyxl", "xlsxwriter"]
docs = ["sphinx", "sphinx-rtd-theme"]
excel = ["xlsxwriter"]
# Legacy bw2io compares tuple versions and cannot import current bw2data.
brightway = ["bw2io>=0.8.12,<0.9", "bw2data>=3.6,<4", "bw2calc>=1.8,<2"]

[tool.setuptools.dynamic]
version = {attr = "carculator_utils._version.VERSION"}

[tool.setuptools.packages.find]
include = ["carculator_utils", "carculator_utils.*"]

[tool.setuptools.package-data]
carculator_utils = ["data/*.json", "data/*.yaml", "data/*.yml", "data/*.csv", "data/*.npz", "data/*.xlsx", "data/**/*.json", "data/**/*.yaml", "data/**/*.yml", "data/**/*.csv", "data/**/*.npz", "data/**/*.xlsx"]

[tool.setuptools.exclude-package-data]
"*" = ["**/.DS_Store", "**/__pycache__/*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

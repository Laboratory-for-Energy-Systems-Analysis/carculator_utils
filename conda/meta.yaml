package:
  name: carculator_utils
  version: 1.3.6.dev0
source:
  path: ..
build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=3.11,<3.13
    - numpy >=1.26.4,<2
    - pandas >=2.2.3
    - scipy >=1.11
    - xarray >=2024.1.0
    - numexpr
    - stats_arrays >=0.6
    - klausen
    - PyYAML
    - pyprind
    - pycountry
test:
  imports:
    - carculator_utils
about:
  home: https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator_utils
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Shared vehicle life cycle assessment calculations and inventories
